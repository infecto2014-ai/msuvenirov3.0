<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>body{display:flex;gap:10px;flex-wrap:wrap;padding:10px} .stand{width:620px;height:560px}</style></head><body>
<script src="models.js"></script>
<script>
const M=MSModels; M.ensureDefs();
[['white','front','a4'],['black','back','a3'],['red','front','a6'],['blue','front','a5']].forEach(([c,v,f])=>{
 const col=M.COLORS.find(x=>x.id==c); const d=document.createElement('div'); d.className='stand';
 const [w,h]=M.FORMATS[f]; const pl=M.PLACES[v=='front'?'front':'back'];
 d.innerHTML=`<svg class="stand-svg ${col.dark?'tee-dark':''}" viewBox="-480 -40 960 830" style="${M.colorVars(col)}">

 <ellipse class="contact" cx="0" cy="724" rx="340" ry="30"/>
 <g>${v=='front'?M.teeFront():M.teeBack()}</g>
 <rect class="frame" x="${-w/2}" y="${pl.y}" width="${w}" height="${h}"/></svg>`;
 document.body.appendChild(d);});
</script></body></html>
